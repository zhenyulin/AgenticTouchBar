# yaml-language-server: $schema=../../Desktop/code/aurora/porter/schemas/manifest.json
---
#
# component metadata
#
private: true

component:
  name: BTT
  type: cli

language: shell

#
# component repo config
#

config: ~/Desktop/code/aurora/pymap

# config file declaration

copy:
  - .coveragerc
  - .python-version
  - pyrightconfig.json
  - pytest.ini
  - ruff.toml

symlink:
  - .editorconfig
  - .markdownlint.yaml
  - .pre-commit-config.yaml
  - .vscode

agents: ~/Desktop/code/aurora/.agents

# repo local customization

.gitignore: |-
  # use local cspell dictionary
  !/cspell.config.yaml
