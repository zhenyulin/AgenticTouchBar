version: "0.2"
language: en-GB, en-US
# A lowercase entry still covers Backtest and BACKTEST; a capitalised entry does
# not cover the lowercase form. Prefer lowercase entries unless the casing is
# itself the thing being asserted (tickers, MICs, env-var names).
caseSensitive: true
# Enabled for every file type, not only *.py: these terms appear in prose and
# notebooks too, and a filetype-triggered dictionary would not cover *.md.
dictionaries:
  - python
files:
  - "**/*.py"
  - "**/*.md"
  - "**/*.ipynb"
  - "**/*.jsonc"
ignorePaths:
  - specs/graph/svg/**
# ANSI color escapes appear in test assertions as `\x1b[37mword`; without this,
# cspell merges the trailing `m` with the following word into a bogus token.
ignoreRegExpList:
  - '\\x1b\[[0-9;]*m'
