[pytest]
# ensure project root is added to sys.path for pytest to avoid automatic discovery confusion
pythonpath = .
testpaths = tests
# default marker when pytest is run outside just recipe — kept identical to
# recipe.just's PYTEST_SCOPE_OFFLINE, which derives every other scope from it.
# --strict-markers rejects an undeclared marker APPLIED to a test. It does not
# validate names used in a `-m` expression: pytest evaluates an unknown name
# there as simply matching nothing, which is how `-m "not online"` went
# unnoticed. Deriving every scope from one base is what guards that case.
addopts = --strict-markers -m "not integration and not paid_api and not benchmark and not large_snapshot"
env =
    OBS_LOG_ENABLED=FALSE
    OBS_PROGRESS_ENABLED=FALSE
    OBS_TIMER_ENABLED=FALSE
    POLICY_ENABLE_PAID_CONNECTORS=FALSE
    RUNTIME_CACHE_ENABLED=FALSE
    RUNTIME_PARALLEL_ENABLED=FALSE
    RUNTIME_RETRY_ENABLED=FALSE

markers =
    integration: test that requires live network or API access
    paid_api: integration test that consumes paid-provider quota
    benchmark: performance benchmark excluded from ordinary CI
    complex: test that would take a long time to run
    ci: test that would only run in ci
    large_snapshot: large fixture or snapshot test excluded from ordinary CI
