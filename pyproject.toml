[tool.ruff.lint]
# Pin the classic default rule set: ruff 0.16+ enables a much broader curated
# set (bandit S, blind-except BLE001, try-except-raise TRY201, ...) that this
# script codebase was not written against. Restore the historical E4/E7/E9/F
# defaults so post-edit checks stay green on the existing code.
select = ["E4", "E7", "E9", "F"]
